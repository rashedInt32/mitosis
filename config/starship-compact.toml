"$schema" = 'https://starship.rs/config-schema.json'

# Compact variant of starship.toml for narrow panes (loom and tmux splits).
# ~/.config/zconfig/.zshrc switches to it below 100 columns. Same look, but
# no user name, no language versions, a shorter path and a truncated branch.

format = """
[](color_1)\
$os\
$username\
[](bg:color_2 fg:color_1)\
$directory\
[](fg:color_2 bg:color_3)\
$git_branch\
$git_status\
[](fg:color_3 bg:color_4)\
$git_state\
$package\
[](fg:color_4 bg:color_5)\
$docker_context\
$conda\
$pixi\
[](fg:color_5 bg:color_6)\
$time\
[ ](fg:color_6)\
$line_break${env_var.SLUICE_WINDOWS}$character"""

palette = 'gradient_modern'

[palettes.gradient_modern]
color_fg0 = '#FFFFFF'          # White text
color_bg1 = '#011627'          # Dark text: night-owl's ground, so segment text reads navy, not grey
color_bg3 = '#2E2E2E'
color_1 = '#BF82FF'            # Violet  (P5: OKLCH C 0.20 capped to sRGB; lightness rises 0.72 to 0.89 so each hue holds its colour)
color_2 = '#7997FF'            # Blue
color_3 = '#53BBFE'            # Sky
color_4 = '#00DDEF'            # Cyan
color_5 = '#03F0BD'            # Mint
color_6 = '#AEF455'            # Lime
color_7 = '#e84118'
color_8 = '#32ff7e'
color_9 = '#fff200'
color_10 = '#ff9f1a'



# ────────────────────────────────
# OS / USER
# ────────────────────────────────
[os]
disabled = false
style = "bg:color_1 bold fg:color_bg1"   # dark text for contrast

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
disabled = true
show_always = true
style_user = "bg:color_1 bold fg:color_bg1"   # dark text
style_root = "bg:color_1 bold fg:color_bg1"
format = '[ $user ]($style)'

# ────────────────────────────────
# DIRECTORY
# ────────────────────────────────
[directory]
style = "bold fg:color_bg1 bg:color_2"        # dark text for improved contrast
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# ────────────────────────────────
# GIT
# ────────────────────────────────
[git_branch]
truncation_length = 18
truncation_symbol = "…"
symbol = ""
style = "bg:color_3"
format = '[[ $symbol $branch ](bold fg:color_bg1 bg:color_3)]($style)'  # dark text

[git_status]
style = "bg:color_3"
format = '[[($all_status$ahead_behind )](bold fg:color_bg1 bg:color_3)]($style)'  # dark text

# ────────────────────────────────
# GIT STATE / PROJECT VERSION
# ────────────────────────────────
# Only shows while a rebase, merge, cherry-pick or bisect is in progress
[git_state]
style = "bg:color_4"
format = '[[ $state( $progress_current/$progress_total) ](bold fg:color_bg1 bg:color_4)]($style)'

# The project's own version (package.json, Cargo.toml, ...), not the runtime's.
# Private packages too: most plugin repos are private but carry real versions.
[package]
disabled = true
symbol = ""
display_private = true
style = "bg:color_4"
format = '[[ $symbol $version ](bold fg:color_bg1 bg:color_4)]($style)'

# ────────────────────────────────
# DOCKER / ENVIRONMENT
# ────────────────────────────────
[docker_context]
symbol = ""
style = "bg:color_5"
format = '[[ $symbol( $context) ](bold fg:color_bg1 bg:color_5)]($style)'  # dark text

[conda]
style = "bg:color_5"
format = '[[ $symbol( $environment) ](bold fg:color_bg1 bg:color_5)]($style)'

# ────────────────────────────────
# TIME (Disabled)
# ────────────────────────────────
[time]
disabled = true
time_format = "%R"
style = "bg:color_6"
format = '[[  $time ](bold fg:color_bg1 bg:color_6)]($style)'  # dark text

# ────────────────────────────────
# CHARACTER / PROMPT END
# ────────────────────────────────
[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[  ](bold fg:color_8)'             # futuristic check/arrow
error_symbol = '[  ](bold fg:color_7)'               # bold angular X
vimcmd_symbol = '[ 󰌌 ](bold fg:color_9)'             # terminal cursor
vimcmd_replace_one_symbol = '[󰞷](bold fg:color_6)' # circular tech arrow
vimcmd_replace_symbol = '[󰞸](bold fg:color_6)'     # double tech arrow
vimcmd_visual_symbol = '[󰌖](bold fg:color_3)'      # swap icon, selection mode

# sluice window mark: "◆2/3" before the prompt glyph while this session has
# more than one window. The zshrc's _sluice_windows_mark exports the variable;
# when it is unset the module renders nothing at all.
[env_var.SLUICE_WINDOWS]
variable = "SLUICE_WINDOWS"
format = "[ ◆$env_value]($style)"
style = "fg:color_6"
