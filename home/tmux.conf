##### Terminal Capabilities #####
# Use 256-color with fallback-safe truecolor support
set-option -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"

#set-option -g default-command "zsh -c 'source ~/.zshrc; zsh -i'"

# Enable status bar by default
set -g status on
set -g mouse on


set -g status-position bottom
set -g status on
set -g pane-border-status off
set -g window-size latest
setw -g aggressive-resize on
# Transparent status bar styling with Everforest colors
# Match tokyonight-night theme
#set -g status-style bg=#1a1b26,fg=#c0caf5

# Left and right status
set -g status-bg "#011627"

# Status-left with consistent fg/bg
# The session switcher puts the current session in a coloured pill here, so
# the plain "#S" it used to show would just be the same name twice.
set -g status-left ""
set -g status-right ""
set -g window-status-format ""
set -g window-status-current-format ""
set -g status-left-length 50
# Window status
setw -g window-status-style bg=#1a1b26,fg=#7aa2f7
setw -g window-status-current-style bg=#1a1b26,fg=#bb9af7
#setw -g window-status-format "#I:#W"
#setw -g window-status-current-format "#I:#W*"

# Separators for a clean look
set -g status-justify left

# Make escape latency faster (great for vim users)
set -s escape-time 0

# Start windows at index 1
set -g base-index 1

##### Prefix Key #####
# Ctrl-a is the prefix, except while loom (the floating terminal in nvim) has
# focus: then tmux hands C-a to nvim, and loom uses it as its own prefix.
# loom marks that state with the pane option @loom. The nvim check stops a
# stale @loom from swallowing the prefix after nvim exits.
# tmux tests the prefix option before root bindings, so the prefix is None
# and this binding enters the prefix table itself.
unbind C-b
set -g prefix None
bind -n C-a if -F '#{&&:#{@loom},#{==:#{pane_current_command},nvim}}' 'send-keys C-a' 'switch-client -T prefix'
bind C-a send-keys C-a

bind r source-file ~/.tmux.conf


# spit window keybindings
# split current window horizontally
bind - split-window -v
# split current window vertically
bind _ split-window -h

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

##### Copy Mode (Vi-style) #####
# Enable vi keybindings in copy mode
setw -g mode-keys vi

# Vim-style visual selection (v) and copy (y) to system clipboard (macOS-specific)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"



##### Sessionizer #####
# Sessionizer script
bind-key -r s new-window -n sessionizer "$HOME/.config/.local/scripts/tmux-sessionizer"

# Git worktree sessionizer: create/switch worktrees, one tmux session per branch
bind-key g new-window -n worktree "$HOME/.config/.local/scripts/tmux-worktree"



# Choose session instead of search
bind-key f choose-session



##### Claude session manager #####
# prefix+y launches/attaches Claude for the current dir; prefix+u opens the picker.
# Loaded last so its bindings win over anything above.
#
# Open the picker in vim-style nav mode instead of fzf's default filter mode:
# j/k move, x kills, q closes; i or a drops into filter (fuzzy) mode, esc
# returns to nav. Written with \$CLAUDE_PICKER so tmux stores a literal $.
set -g @claude_fzf_options "\
  --prompt 'nav> ' \
  --bind 'j:down' \
  --bind 'k:up' \
  --bind 'q:abort' \
  --bind 'x:execute-silent(kill {3})+reload(sleep 0.3; \$CLAUDE_PICKER --list)' \
  --bind 'i:unbind(j,k,q,i,a,x)+change-prompt(filter> )' \
  --bind 'a:unbind(j,k,q,i,a,x)+change-prompt(filter> )' \
  --bind 'esc:rebind(j,k,q,i,a,x)+change-prompt(nav> )'"
run-shell '~/.tmux/plugins/tmux-claude-session-manager/claude_session_manager.tmux'

##### Session switcher #####
# Numbered session list in status-right, prefix+1..9 to jump, prefix+0 for the
# previous one. Overrides tmux's own prefix+0-9 select-window; prefix+n and
# prefix+p still cycle windows.
#
# Bound to the prefix table rather than Alt+N on purpose: this machine's
# keyboard layout is ABC, and Ghostty only enables macos-option-as-alt by
# default for the U.S. layouts, so Option+digit would become a Unicode
# character that tmux never sees.
# Flat leaves room for whole names at 115 columns; the pill style did not.
set -g @sessions_name_width 0
# Coloured text rather than filled pills. This bar is only visible while nvim is
# unfocused, stacked under lualine -- which is itself a row of filled pills. Two
# rows of the same treatment give both equal weight and neither wins. Flat keeps
# what carries meaning, the colour and the number, and drops the fill.
# The current session stays a filled pill so "here" still reads at a glance.
set -g @sessions_style flat
# Circled digits come from the default `nerd` set, which is JetBrains Mono Nerd
# Font's own -- Material Design numeric-N-circle at U+F0CA0, not any Unicode
# enclosed-digit block. No font fallback, so no second family on the bar.
run-shell '~/Documents/codes/packages/tmux-sessions.tmux/tmux-sessions.tmux'
